<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-page">

        <!-- IMAGEN -->

        <div class="login-image">

            <img
            src="img/tombin.png"
            alt="CivicAlert">

        </div>

        <!-- FORMULARIO -->

        <div class="login-container">

            <h1>CREAR CUENTA</h1>

            <form
            onsubmit="return validarDatos()">

                <input
                type="text"
                id="nombre"
                placeholder="Nombre completo"
                required>

                <input
                type="email"
                id="correo"
                placeholder="Correo electrónico"
                required>

                <input
                type="text"
                id="usuario"
                placeholder="Usuario"
                required>

                <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required>

                <input
                type="tel"
                id="telefono"
                placeholder="Teléfono"
                maxlength="10"
                required>

                <input
                type="number"
                id="edad"
                placeholder="Edad"
                required>

                <button type="submit">CREAR CUENTA</button>

            </form>

            <br>

            <a href="login.html">Volver al login</a>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
